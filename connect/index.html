<style>
  :root{
    --purple-deep:#4c0686; --purple:#50058d; --purple-bright:#6a22a4;
    --gold:#c9a227; --gold-light:#ebd79a; --cream:#fbf7f0; --ink:#241a33;
    --muted:#6e6379; --line:#e4d9c8;
    --serif:"EB Garamond",Garamond,Georgia,serif;
    --script:"Great Vibes",cursive;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);line-height:1.6;}

  .wrap{max-width:520px;margin:0 auto;}

  /* --------- the front of the card: her sky, her arch, her light --------- */
  .front{
    position:relative;overflow:hidden;text-align:center;
    padding:16px 24px 0;
    /* the card front's own gradient: blue-lavender sky at the top, cream and
       gold through the middle, warm at the base, fading into the page. */
    background:linear-gradient(180deg,
      #cdbde2 0%, #c8c2e6 6%, #c5c1e6 11%, #ddd3e0 17%, #f4dcdd 22%,
      #fde4d6 32%, #fdefd8 45%, #fbe2ce 58%, #f8d9c6 72%, #f2cbb6 86%, #fbf7f0 100%);
  }
  /* the sunrise, above the arch, so it never crosses her face */
  .deco{position:relative;width:100%;max-width:360px;height:118px;margin:0 auto;overflow:hidden;pointer-events:none;}
  .sunburst{position:absolute;left:50%;bottom:34px;margin-left:-40px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle at 50% 36%,#fffbe8 0%,#f9e8b0 26%,#edd283 52%,#dcb84f 78%,#c9a227 96%,rgba(201,162,39,0) 100%);
    box-shadow:0 0 30px 7px rgba(238,204,110,.60), 0 0 84px 22px rgba(238,204,110,.25);}
  .rays{position:absolute;left:50%;bottom:-56px;margin-left:-140px;width:280px;height:280px;opacity:.7;
    -webkit-mask-image:radial-gradient(circle,#000 30%,rgba(0,0,0,.5) 60%,transparent 88%);
            mask-image:radial-gradient(circle,#000 30%,rgba(0,0,0,.5) 60%,transparent 88%);}

  .photo{position:relative;width:min(276px,72vw);margin:0 auto;}
  .photo img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:50% 34%;
    border-radius:140px 140px 8px 8px;border:1.5px solid rgba(201,162,39,.8);
    box-shadow:0 20px 44px rgba(74,37,128,.20), 0 0 0 9px rgba(255,255,255,.34);}

  .mark{position:relative;z-index:2;margin-top:14px;}
  .lotus{width:132px;height:83px;display:block;margin:0 auto;}
  .word{font-family:var(--script);font-size:clamp(38px,10.5vw,50px);line-height:1;margin:4px 0 0;
    color:#7a5a10;
    background:linear-gradient(180deg,#b98f1c 0%,#8f6a0c 60%,#6f5107 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .rule{width:132px;height:1.5px;margin:10px auto 10px;background:linear-gradient(90deg,transparent,#a8801a,transparent);}
  .name{font-size:22px;font-weight:600;letter-spacing:.24em;text-indent:.24em;color:#4b2a72;margin:0;}
  .title{font-size:11.5px;letter-spacing:.4em;text-indent:.4em;color:#7a5a10;margin:5px 0 0;text-transform:uppercase;font-weight:600;}

  /* --------- the tagline band, exactly as it sits on the card --------- */
  .band{
    background:linear-gradient(115deg,#4c0686 0%,#50058d 48%,#6a22a4 100%);
    text-align:center;padding:14px 16px;margin-top:26px;
  }
  .band span{font-family:var(--script);color:#f2dfa9;font-size:clamp(16.5px,4.7vw,26px);line-height:1.3;
    display:inline-block;overflow-wrap:normal;word-break:keep-all;}
  .band i{font-style:normal;color:#d8b453;font-size:.5em;vertical-align:middle;padding:0 8px;}

  /* --------- the contact, and nothing else --------- */
  .contact{padding:24px 24px 40px;}
  .act{display:flex;align-items:center;gap:15px;background:#fff;border:1px solid rgba(201,162,39,.55);
    border-radius:15px;padding:16px 18px;min-height:64px;margin-bottom:12px;
    text-decoration:none;color:var(--ink);box-shadow:0 10px 24px rgba(46,26,74,.10);}
  .act:hover,.act:focus-visible{border-color:var(--gold);}
  .act svg{width:23px;height:23px;flex:0 0 auto;color:var(--purple);}
  .act .txt{min-width:0;}
  .act b{display:block;font-size:18px;font-weight:600;word-break:break-word;line-height:1.25;}
  .act span.lbl{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;}
  .act .go{margin-left:auto;color:var(--gold);font-size:22px;line-height:1;flex:0 0 auto;}

  .save{display:block;text-align:center;background:var(--gold);color:#3d025f;text-decoration:none;
    padding:18px;border-radius:15px;font-weight:600;font-size:18px;margin:20px 0 8px;border:1px solid var(--gold);}
  .save:hover,.save:focus-visible{background:var(--gold-light);}
  .note{text-align:center;color:var(--muted);font-size:14px;margin:0;}

  @media (max-width:420px){
    .name{font-size:19px;}
    .act b{font-size:17px;}
  }
</style>
</head>
<body>
